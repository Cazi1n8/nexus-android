name: NEXUS CORE — instalação, armazenamento e dados opcionais

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/java/br/com/nexus/assistant/Core*Test.kt'
      - 'app/src/androidTest/java/br/com/nexus/assistant/ExtensionDataSmokeTest.kt'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - 'scripts/run_android_core_storage.py'
      - 'scripts/tests/test_run_android_core_storage.py'
      - '.github/workflows/core-storage-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-core-storage-${{ github.ref }}
  # Keep diagnostics from an already running emulator when a repair is pushed.
  cancel-in-progress: false

jobs:
  core-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Instalar SDK e compilador nativo
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Testar coleta e validação das provas
        run: python3 -m unittest discover -s scripts/tests -p test_run_android_core_storage.py -v
      - name: Preparar runtime e modelo de mãos sem pesos generativos
        run: |
          python3 scripts/fetch_llama_cpp.py
          python3 scripts/fetch_hand_model.py
          python3 scripts/prepare_mediapipe_runtime.py
          python3 scripts/fetch_ocr_runtime.py
          python3 scripts/fetch_object_model.py --with-test-fixture
      - name: Compilar CORE de teste e instrumentação x86_64
        run: gradle -PnexusTestBuildType=coreTest -PnexusAbis=x86_64 --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace assembleCoreTest assembleCoreTestAndroidTest
      - name: Habilitar KVM no executor temporário
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: CORE sem internet e instalação/remoção real dos dados opcionais
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 3072 -camera-back none -camera-front none
          script: python3 scripts/run_android_core_storage.py --allow-reset-emulator --with-extensions
      - name: Guardar observações sintéticas e instrumentação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-core-storage-observations-${{ github.run_number }}
          path: build/core-storage-smoke/
          if-no-files-found: ignore
          retention-days: 14
