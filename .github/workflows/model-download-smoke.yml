name: NEXUS — download real dos modelos no Android

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/br/com/nexus/assistant/data/local/LocalModelManager.kt'
      - 'app/src/main/java/br/com/nexus/assistant/data/local/LocalModelCatalog.kt'
      - 'app/src/main/java/br/com/nexus/assistant/data/local/ModelIntegrity.kt'
      - 'app/src/androidTest/java/br/com/nexus/assistant/ProductionModelDownloadTest.kt'
      - 'app/build.gradle.kts'
      - 'gradle.properties'
      - 'scripts/run_android_model_download.py'
      - 'scripts/tests/test_run_android_model_download.py'
      - '.github/workflows/model-download-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-production-download-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Instalar SDK e compilador nativo
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Testar preparação e validação dos relatórios
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Preparar fontes e assets verificados
        run: |
          python3 scripts/fetch_llama_cpp.py
          python3 scripts/fetch_hand_model.py
          python3 scripts/fetch_ocr_models.py
          python3 scripts/fetch_ocr_runtime.py
      - name: Compilar aplicativo e teste instrumentado
        run: gradle -PnexusBundleModel=false --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace assembleDebug assembleDebugAndroidTest
      - name: Habilitar KVM no executor temporário
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # This is an explicit developer/CI download of both public models. No GGUF
      # is pushed from the host, bundled in the APK or uploaded with the evidence.
      - name: Baixar modelos pelo app e executar o compacto
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -partition-size 4096
          script: python3 scripts/run_android_model_download.py
      - name: Guardar apenas evidências do download e inferência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-production-download-${{ github.run_number }}
          path: build/model-download-smoke/
          if-no-files-found: ignore
          retention-days: 14
