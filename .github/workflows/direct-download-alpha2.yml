name: NEXUS alpha.2 — download direto do APK existente

# One explicitly requested test release, not an opt-in for future debug builds.
# Always reuses build 16, preserving its APK and signing certificate.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/direct-download-alpha2.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: nexus-direct-download-alpha2
  cancel-in-progress: false

jobs:
  publish-existing-test-apk:
    if: github.repository == 'Cazi1n8/nexus-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Conferir a origem do artefato existente
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const source = '62ec1e3a714cdcc577e04f659185808bd6c9ab3f';
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: 40389844327});
            if (run.status !== 'completed' || run.conclusion !== 'success' || run.head_sha !== source)
              throw new Error('A compilação de origem não corresponde à versão verificada.');
            const {data: artifact} = await github.rest.actions.getArtifact({owner, repo, artifact_id: 12682941109});
            if (artifact.expired || artifact.name !== 'nexus-debug-16' || artifact.workflow_run?.id !== run.id ||
                artifact.digest !== 'sha256:c9898979c7f301712970949c0cbf260c92e946127caeab0e980d43983f25ba36')
              throw new Error('O artefato não corresponde ao ZIP de teste verificado.');
      - uses: actions/download-artifact@v4
        with:
          name: nexus-debug-16
          run-id: 40389844327
          repository: Cazi1n8/nexus-android
          github-token: ${{ github.token }}
          path: test-apk
      - name: Verificar checksum e preparar o arquivo para download
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, shutil
          folder = Path('test-apk')
          apks = list(folder.rglob('app-debug.apk'))
          sums = list(folder.rglob('SHA256SUMS.txt'))
          if len(apks) != 1 or len(sums) != 1:
              raise SystemExit('O artefato precisa conter exatamente um APK e seu checksum.')
          rows = sums[0].read_text().strip().splitlines()
          if len(rows) != 1 or not re.fullmatch(r'[0-9a-f]{64}\s+\*?(?:app/build/outputs/apk/debug/)?app-debug\.apk', rows[0]):
              raise SystemExit('Formato do checksum de origem inválido.')
          expected = rows[0].split()[0]
          with apks[0].open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          if actual != expected or not 1_600_000_000 < apks[0].stat().st_size < 2_147_483_648:
              raise SystemExit('O APK foi alterado ou não corresponde à distribuição completa.')
          target = Path('release')
          target.mkdir()
          name = 'NEXUS-3.0.0-alpha.2.apk'
          shutil.move(str(apks[0]), target / name)
          (target / 'SHA256SUMS.txt').write_text(f'{actual}  {name}\n')
          print(f'APK preservado: {actual}')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Conferir versão e assinatura sem recompilar
        run: |
          sdkmanager 'build-tools;35.0.0'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/NEXUS-3.0.0-alpha.2.apk > release/APK_CERTIFICATE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging release/NEXUS-3.0.0-alpha.2.apk > apk-badging.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('apk-badging.txt').read_text()
          required = ("name='br.com.nexus.assistant'", "versionCode='25'", "versionName='3.0.0-alpha.2'", "minSdkVersion:'26'")
          if not all(value in text for value in required):
              raise SystemExit('Versão ou aplicativo inesperado; publicação interrompida.')
          PY
      - name: Publicar esta versão de teste com link direto
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 62ec1e3a714cdcc577e04f659185808bd6c9ab3f
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          Path('release-notes.md').write_text(
              'APK de teste solicitado pelo responsável para download direto, sem login ou extração de ZIP.\n\n'
              'É exatamente o APK do artefato nexus-debug-16, execução 40389844327, fonte 62ec1e3a714cdcc577e04f659185808bd6c9ab3f. '
              'Não foi recompilado nem assinado novamente. A chave permanece de depuração.\n\n'
              'IA incluída; Android 8 ou superior. A IA offline exige 64 bits, memória e armazenamento suficientes. '
              'O APK tem cerca de 1,74 GB; reserve 8 GB para instalação/preparação.\n\n'
              'Limitações reais: a qualidade da IA reprovou os casos críticos 3, 9 e 12. '
              'Mouse e voz em segundo plano precisam de teste físico; Libras é parcial. '
              'Não há aprovação comprovada pelo Play Protect. Mantenha a proteção ativada.\n\n'
              'Confira SHA256SUMS.txt e APK_CERTIFICATE.txt. Preserve seus dados antes de trocar uma instalação '
              'com certificado diferente. Relatórios completos no README, TESTES_NEXUS_AI.md e AUDITORIA_PLAY_PROTECT.md.\n',
              encoding='utf-8')
          PY
          tag='v3.0.0-alpha.2-download-16'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish > existing-source.txt
            test "$(cat existing-source.txt)" = "$SOURCE_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease --title 'NEXUS 3.0 alpha.2 — APK de teste' --notes-file release-notes.md
          fi
          gh release upload "$tag" release/NEXUS-3.0.0-alpha.2.apk release/SHA256SUMS.txt release/APK_CERTIFICATE.txt --repo "$GITHUB_REPOSITORY" --clobber
          echo 'Download direto: https://github.com/Cazi1n8/nexus-android/releases/download/v3.0.0-alpha.2-download-16/NEXUS-3.0.0-alpha.2.apk' >> "$GITHUB_STEP_SUMMARY"
