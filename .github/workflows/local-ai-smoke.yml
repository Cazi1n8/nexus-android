name: NEXUS IA local — inferência real no Android

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/cpp/**'
      - 'app/src/main/java/br/com/nexus/assistant/data/local/**'
      - 'app/src/main/java/br/com/nexus/assistant/data/AiCoordinator.kt'
      - 'app/src/main/java/br/com/nexus/assistant/device/DevicePolicy.kt'
      - 'app/src/androidTest/java/br/com/nexus/assistant/LocalAiInferenceTest.kt'
      - 'app/build.gradle.kts'
      - 'scripts/fetch_language_model.py'
      - 'scripts/run_android_ai_smoke.py'
      - '.github/workflows/local-ai-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-local-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-local-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Definir arquivo temporário do modelo
        run: echo "NEXUS_FIXTURE_FILE=$RUNNER_TEMP/nexus-ai-fixture/qwen2.5-0.5b-instruct-q4_k_m.gguf" >> "$GITHUB_ENV"
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Instalar SDK e compilador nativo
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Testar preparação e validação da prova
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Preparar fontes e modelos empacotados
        run: |
          python3 scripts/fetch_llama_cpp.py
          python3 scripts/fetch_hand_model.py
          python3 scripts/fetch_ocr_models.py
      # This explicit developer/CI download is not an automatic download on a user's phone.
      # Weights live only on the temporary runner and are never uploaded or included in the APK.
      - name: Baixar GGUF público fixado para o teste real
        run: python3 scripts/fetch_language_model.py --output "$NEXUS_FIXTURE_FILE"
      - name: Compilar aplicativo e teste instrumentado
        run: gradle --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace assembleDebug assembleDebugAndroidTest
      - name: Habilitar KVM no executor temporário
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Executar o modelo real no Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/run_android_ai_smoke.py --model "$NEXUS_FIXTURE_FILE"
      - name: Guardar somente observações e logs do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-local-ai-observations-${{ github.run_number }}
          path: build/local-ai-smoke/
          if-no-files-found: ignore
          retention-days: 14
