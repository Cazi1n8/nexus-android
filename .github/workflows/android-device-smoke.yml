name: NEXUS Android — teste em emulador

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'scripts/**'
      - '.github/workflows/android-device-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-device-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Instalar SDK e compilador nativo
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar fontes e modelos verificados
        run: |
          python3 scripts/fetch_llama_cpp.py
          python3 scripts/fetch_hand_model.py
          python3 scripts/prepare_mediapipe_runtime.py
          python3 scripts/fetch_object_model.py --with-test-fixture
          python3 scripts/fetch_ocr_models.py
          python3 scripts/fetch_ocr_runtime.py
      - name: Compilar aplicativo e testes instrumentados
        run: gradle -PnexusAbis=x86_64 -PnexusBundleModel=false -PnexusBundleVision=true --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace assembleDebug assembleDebugAndroidTest
      # KVM is exposed only on this temporary GitHub-hosted runner.
      # These are the udev permissions documented by android-emulator-runner.
      - name: Habilitar KVM no executor temporário
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Executar testes no Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: gradle -PnexusAbis=x86_64 -PnexusBundleModel=false -PnexusBundleVision=true --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace connectedDebugAndroidTest
      - name: Guardar relatórios instrumentados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-emulator-reports-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
