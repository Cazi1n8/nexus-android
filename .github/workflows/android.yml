name: NEXUS Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Instalar SDK 35 e compilador nativo
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Testar integridade da preparação nativa
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Preparar runtime local pinado
        run: python3 scripts/fetch_llama_cpp.py
      - name: Baixar modelo oficial de mãos
        run: python3 scripts/fetch_hand_model.py
      - name: Preparar rastreamento sem registro de uso do SDK
        run: python3 scripts/prepare_mediapipe_runtime.py
      - name: Preparar classificação visual local e imagem de teste
        run: python3 scripts/fetch_object_model.py --with-test-fixture
      - name: Preparar português e inglês para leitura offline
        run: python3 scripts/fetch_ocr_models.py
      - name: Preparar biblioteca OCR com SHA-256 fixado
        run: python3 scripts/fetch_ocr_runtime.py
      - name: Testar servidor intermediário
        run: python3 -m unittest discover -s server/tests -v
      - name: Testes, lint e APK de depuração
        run: gradle --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace testDebugUnitTest lintDebug lintCoreTest assembleDebug assembleCoreTest assembleDebugAndroidTest
      - name: Resumo SHA256 do APK
        run: sha256sum app/build/outputs/apk/coreTest/app-coreTest.apk > app/build/outputs/apk/coreTest/SHA256SUMS.txt
      - name: Auditar conteúdo e orçamento do CORE universal
        run: python3 scripts/inspect_core_apk.py app/build/outputs/apk/coreTest/app-coreTest.apk --universal --output app/build/outputs/apk/coreTest/CORE_PACKAGE_AUDIT.json
      - name: Publicar APK de teste como artefato
        uses: actions/upload-artifact@v4
        with:
          name: nexus-core-${{ github.run_number }}
          path: |
            app/build/outputs/apk/coreTest/app-coreTest.apk
            app/build/outputs/apk/coreTest/SHA256SUMS.txt
            app/build/outputs/apk/coreTest/CORE_PACKAGE_AUDIT.json
          if-no-files-found: error
          retention-days: 30
      - name: Relatórios de testes e lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  publish-test-apk:
    # Public debug distribution is paused while the installation block is reviewed.
    # The build and downloadable Actions artifact continue normally.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NEXUS_PUBLICAR_APK_DEBUG == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nexus-core-${{ github.run_number }}
          path: test-apk
      - name: Publicar APK de teste com download direto
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const gradle = fs.readFileSync('app/build.gradle.kts', 'utf8');
            const version = gradle.match(/versionName\s*=\s*"([^"]+)"/)[1];
            const tag = `v${version}-build-${context.runNumber}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: `NEXUS ${version} · teste ${context.runNumber}`,
                prerelease: true, make_latest: 'false',
                body: 'APK de depuração para Android 8.0 ou superior. Ajuste automático por aparelho; recursos dependem do hardware. IA offline opcional exige 64 bits, RAM e download autorizado do modelo. Modelos de conversa e dados de visão são opcionais; o mouse offline está incluído. Voz, câmera e controle global precisam de teste físico. Leia README.md e PROGRESSO_ARMAZENAMENTO.md antes de instalar. A assinatura de teste pode mudar entre execuções; exporte dados importantes antes de trocar uma instalação incompatível. Relatórios: ' + context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId
              })).data;
            }
            function findApk(folder) {
              for (const entry of fs.readdirSync(folder, {withFileTypes: true})) {
                const path = `${folder}/${entry.name}`;
                if (entry.isDirectory()) { const found = findApk(path); if (found) return found; }
                else if (entry.name === 'app-coreTest.apk') return path;
              }
              return null;
            }
            const path = findApk('test-apk');
            if (!path) throw new Error('APK aprovado não encontrado no artefato.');
            const data = fs.readFileSync(path);
            const filename = `NEXUS-${version}.apk`;
            const checksum = Buffer.from(crypto.createHash('sha256').update(data).digest('hex') + '  ' + filename + '\n');
            const assets = [{name: filename, data}, {name: 'SHA256SUMS.txt', data: checksum}];
            const existing = (await github.rest.repos.listReleaseAssets({owner, repo, release_id: release.id})).data;
            for (const asset of assets) {
              const old = existing.find(item => item.name === asset.name);
              if (old) await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: old.id});
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name: asset.name, data: asset.data});
            }
            core.summary.addLink('Baixar APK de teste', release.html_url);
            await core.summary.write();
