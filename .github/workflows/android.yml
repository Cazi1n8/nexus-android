name: NEXUS Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Baixar modelo oficial de mãos
        run: python3 scripts/fetch_hand_model.py
      - name: Testar servidor intermediário
        run: python3 -m unittest discover -s server/tests -v
      - name: Testes, lint e APK de depuração
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug
      - name: Resumo SHA256 do APK
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Publicar APK de teste como artefato
        uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Relatórios de testes e lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
