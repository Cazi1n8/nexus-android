name: NEXUS — primeiro chat com IA incluída e sem internet

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/java/br/com/nexus/assistant/BundledChatFirstRunTest.kt'
      - 'app/build.gradle.kts'
      - 'scripts/fetch_bundled_model.py'
      - 'scripts/fetch_language_model.py'
      - 'scripts/run_android_bundled_chat.py'
      - '.github/workflows/bundled-chat-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-bundled-chat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-bundled-chat:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Instalar SDK e compilador nativo
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar runtime, OCR e modelo incluído verificados
        run: |
          python3 scripts/fetch_llama_cpp.py
          python3 scripts/fetch_hand_model.py
          python3 scripts/fetch_ocr_models.py
          python3 scripts/fetch_ocr_runtime.py
          python3 scripts/fetch_bundled_model.py
      - name: Compilar APK completo e teste instrumentado
        run: gradle --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace assembleDebug assembleDebugAndroidTest
      - name: Habilitar KVM no executor temporário
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Primeiro chat real pela interface, com Wi-Fi e dados desligados
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 4096 -camera-back none -camera-front none
          script: python3 scripts/run_android_bundled_chat.py --allow-reset-emulator
      - name: Guardar somente observações e logs sintéticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-bundled-chat-observations-${{ github.run_number }}
          path: build/bundled-chat-smoke/
          if-no-files-found: ignore
          retention-days: 14
